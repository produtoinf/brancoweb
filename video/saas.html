<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Branco — Motion SaaS 16s</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<img id="logo" src="logo.png" alt="" hidden>
<script>
/* Motion de 16 s para divulgar a prospecção do SaaS da Branco.
   120 BPM: 1 batida = 0,5 s, 1 compasso = 2 s. Cada cena dura 1 compasso e todo corte cai no tempo forte.
   render(t) desenha o quadro do instante t (em segundos): é o que o render.mjs grava a 60 fps. */
const W = 1920, H = 1080, DUR = 16, BEAT = .5, BAR = 2;
const OR = '#FF4924', BK = '#0A0A0A', WH = '#F4F2EE', GR = '#8A8A90';
const c = document.getElementById('c'), x = c.getContext('2d');
const DISP = '"Archivo", "Helvetica Neue", Arial, sans-serif', MONO = '"JetBrains Mono", Menlo, monospace';
window.DUR = DUR; window.SFX = [];

/* ---------- utilidades ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const out = k => 1 - Math.pow(1 - clamp(k), 3);
const outBack = k => { k = clamp(k); const s = 1.7; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const inn = k => Math.pow(clamp(k), 3);
const span = (t, a, b) => clamp((t - a) / (b - a));
function rnd(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const pulse = t => Math.exp(-((t % BEAT + BEAT) % BEAT) * 9);   // pico em cada batida
function font(px, w = 800, f = DISP) { x.font = `${w} ${px}px ${f}`; }
function txt(s, X, Y, { size = 40, w = 800, f = DISP, col = WH, al = 'left', bl = 'alphabetic', sp = 0, a = 1 } = {}) {
  font(size, w, f); x.fillStyle = col; x.textAlign = al; x.textBaseline = bl; x.letterSpacing = sp + 'px'; x.globalAlpha = a;
  x.fillText(s, X, Y); x.globalAlpha = 1; x.letterSpacing = '0px';
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }

/* logo colorido (o PNG é claro: pinta com a cor da marca) */
const logoImg = document.getElementById('logo'); let logoOr = null, logoWh = null;
function tinge(cor) { const k = document.createElement('canvas'); k.width = logoImg.naturalWidth; k.height = logoImg.naturalHeight;
  const g = k.getContext('2d'); g.drawImage(logoImg, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = cor; g.fillRect(0, 0, k.width, k.height); return k; }

/* ---------- camadas comuns ---------- */
function hud(t, cor = WH, a = .55) {   // sobreposição de visor: cantos, timecode, batida, REC
  x.save(); x.globalAlpha = a; x.strokeStyle = cor; x.lineWidth = 3;
  const m = 56, L = 70;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([px, py, sx, sy]) => {
    x.beginPath(); x.moveTo(px, py + sy * L); x.lineTo(px, py); x.lineTo(px + sx * L, py); x.stroke(); });
  x.globalAlpha = 1;
  const f = Math.floor(t * 60), tc = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % 60).padStart(2, '0')}`;
  txt(tc, m + 6, H - m - 22, { size: 22, w: 500, f: MONO, col: cor, a: a });
  txt('BRANCO // PROSPECÇÃO', W - m - 6, H - m - 22, { size: 22, w: 500, f: MONO, col: cor, al: 'right', sp: 3, a: a });
  // REC + batidas
  x.globalAlpha = a; x.fillStyle = OR; x.beginPath(); x.arc(m + 18, m + 40, 9, 0, 7); x.globalAlpha = a * (.5 + .5 * pulse(t)); x.fill();
  txt('REC', m + 38, m + 48, { size: 22, w: 700, f: MONO, col: cor, a: a, sp: 3 });
  const b = Math.floor(t / BEAT);
  for (let i = 0; i < 4; i++) { x.globalAlpha = a * (i === b % 4 ? 1 : .25); x.fillStyle = i === b % 4 ? OR : cor; x.fillRect(W - m - 150 + i * 38, m + 30, 26, 10); }
  txt('BPM 120', W - m - 6, m + 70, { size: 18, w: 500, f: MONO, col: cor, al: 'right', a: a * .8, sp: 2 });
  x.restore();
}
function scan(a = .05) {   // linhas de varredura finas
  x.save(); x.globalAlpha = a; x.fillStyle = '#000'; for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 2); x.restore();
}
function grao(t, a = .06) {   // granulado leve (determinístico)
  const r = rnd(Math.floor(t * 60) * 7919 + 13); x.save(); x.globalAlpha = a; x.fillStyle = '#fff';
  for (let i = 0; i < 900; i++) x.fillRect(r() * W, r() * H, 2, 2); x.restore();
}
function vinheta(a = .55) { const g = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); x.fillStyle = g; x.fillRect(0, 0, W, H); }

/* halftone: pontos cujo tamanho segue uma função (0..1) */
function halftone(fn, cor, passo = 28, ang = .35) {
  x.save(); x.fillStyle = cor; const ca = Math.cos(ang), sa = Math.sin(ang), R = Math.hypot(W, H) / 2;
  for (let gy = -R; gy < R; gy += passo) for (let gx = -R; gx < R; gx += passo) {
    const px = W / 2 + gx * ca - gy * sa, py = H / 2 + gx * sa + gy * ca;
    if (px < -passo || px > W + passo || py < -passo || py > H + passo) continue;
    const v = fn(px, py); if (v <= .02) continue;
    x.beginPath(); x.arc(px, py, Math.min(1, v) * passo * .72, 0, 7); x.fill();
  }
  x.restore();
}
/* faixas diagonais que cobrem (k: 0→1) ou descobrem a tela */
function faixas(k, cores, cobre = true, n = 7) {
  x.save(); x.translate(W / 2, H / 2); x.rotate(-.32);
  const L = Math.hypot(W, H) + 200, bh = L / n;
  for (let i = 0; i < n; i++) {
    const e = ease(clamp(k * 1.5 - i * .5 / n));   // cada faixa um pouco depois da outra
    x.fillStyle = cores[i % cores.length];
    if (cobre) x.fillRect(-L / 2, -L / 2 + i * bh, e * L, bh + 1);          // entra da esquerda
    else x.fillRect(-L / 2 + e * L, -L / 2 + i * bh, (1 - e) * L, bh + 1);   // sai para a direita
  }
  x.restore();
}

/* ---------- formas para a grade (64 pontos cada, para poder interpolar) ---------- */
const NP = 64;
function forma(tipo) {
  const p = [];
  for (let i = 0; i < NP; i++) {
    const a = i / NP * Math.PI * 2, cx = Math.cos(a), sy = Math.sin(a);
    if (tipo === 0) p.push([cx, sy]);                                            // círculo
    else if (tipo === 1) { const m = Math.max(Math.abs(cx), Math.abs(sy)); p.push([cx / m * .86, sy / m * .86]); } // quadrado
    else if (tipo === 2) { const m = Math.abs(cx) + Math.abs(sy); p.push([cx / m, sy / m]); }                      // losango
    else { // cruz
      const ang = a + Math.PI / 4, r = .34 + .66 * Math.pow(Math.abs(Math.cos(2 * ang)), 6);
      p.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
  }
  return p;
}
const FORMAS = [0, 1, 2, 3].map(forma);
function desenhaForma(cx, cy, s, k, rot) {   // k contínuo: 0 círculo, 1 quadrado, 2 losango, 3 cruz, 4 círculo...
  const i = Math.floor(k) % 4, j = (i + 1) % 4, f = ease(k - Math.floor(k)), A = FORMAS[i], B = FORMAS[j];
  const cr = Math.cos(rot), sr = Math.sin(rot);
  x.beginPath();
  for (let n = 0; n < NP; n++) { const px = lerp(A[n][0], B[n][0], f) * s, py = lerp(A[n][1], B[n][1], f) * s;
    const X = cx + px * cr - py * sr, Y = cy + px * sr + py * cr; n ? x.lineTo(X, Y) : x.moveTo(X, Y); }
  x.closePath();
}

/* ---------- esfera de partículas ---------- */
const NS = 2600, ESF = []; { const r = rnd(42); const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < NS; i++) { const y = 1 - i / (NS - 1) * 2, rr = Math.sqrt(1 - y * y), th = ga * i;
    ESF.push({ x: Math.cos(th) * rr, y, z: Math.sin(th) * rr, sx: (r() - .5) * 6, sy: (r() - .5) * 4, sz: (r() - .5) * 4, quente: r() < .05 }); } }

/* ---------- cenas (1 compasso cada) ---------- */
const CENAS = [];

// 1) visor ligando
CENAS.push(function (t, u) {
  x.fillStyle = BK; x.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, ab = out(span(t, 0, .7));
  // grade fina do visor
  x.save(); x.strokeStyle = hexA(WH, .06); x.lineWidth = 1;
  for (let gx = 0; gx <= W; gx += 80) { x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, H * ab); x.stroke(); }
  for (let gy = 0; gy <= H; gy += 80) { x.beginPath(); x.moveTo(0, gy); x.lineTo(W * ab, gy); x.stroke(); }
  x.restore();
  // retícula girando
  const zoom = 1 + inn(span(t, 1.55, 2)) * 5;
  x.save(); x.translate(cx, cy); x.scale(zoom, zoom);
  [[330, 1, .25, 3], [260, -1.6, .55, 2], [200, .8, .9, 6]].forEach(([R, vel, ini, lw], i) => {
    const k = out(span(t, ini * .5, ini * .5 + .6)); x.strokeStyle = i === 1 ? OR : WH; x.lineWidth = lw; x.globalAlpha = .9;
    x.beginPath(); x.arc(0, 0, R, t * vel, t * vel + k * Math.PI * (i === 1 ? 1.4 : 2)); x.stroke();
  });
  for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2 + t * .2, l = i % 6 ? 10 : 24; x.strokeStyle = hexA(WH, .5); x.lineWidth = 2;
    x.beginPath(); x.moveTo(Math.cos(a) * 360, Math.sin(a) * 360); x.lineTo(Math.cos(a) * (360 + l), Math.sin(a) * (360 + l)); x.stroke(); }
  // varredura de radar
  const g = x.createConicGradient(t * 3, 0, 0); g.addColorStop(0, hexA(OR, .45)); g.addColorStop(.12, hexA(OR, 0)); g.addColorStop(1, hexA(OR, 0));
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, 330, 0, 7); x.fill();
  // mira
  x.strokeStyle = OR; x.lineWidth = 3; [[-60, 0, -18, 0], [60, 0, 18, 0], [0, -60, 0, -18], [0, 60, 0, 18]].forEach(l => { x.beginPath(); x.moveTo(l[0], l[1]); x.lineTo(l[2], l[3]); x.stroke(); });
  x.fillStyle = OR; x.beginPath(); x.arc(0, 0, 6 + 6 * pulse(t), 0, 7); x.fill();
  // alvos detectados
  const r = rnd(9); for (let i = 0; i < 9; i++) { const a = r() * 7, d = 80 + r() * 230, ap = span(t, .5 + i * .1, .6 + i * .1);
    if (!ap) continue; const px = Math.cos(a) * d, py = Math.sin(a) * d; x.globalAlpha = ap; x.strokeStyle = OR; x.lineWidth = 2; x.strokeRect(px - 9, py - 9, 18, 18); x.globalAlpha = 1; }
  x.restore();
  // leituras digitando
  const L = ['> SISTEMA BRANCO ONLINE', '> MÓDULO: PROSPECÇÃO', '> FONTES: GOOGLE MAPS · SERPER', '> ALVOS: 1.284 EMPRESAS', '> PRONTO.'];
  L.forEach((s, i) => { const k = span(t, .15 + i * .22, .4 + i * .22); if (!k) return;
    txt(s.slice(0, Math.ceil(s.length * k)), 120, 300 + i * 46, { size: 26, w: 500, f: MONO, col: i === 4 ? OR : WH, a: .9 }); });
  // barras de dados à direita
  for (let i = 0; i < 6; i++) { const v = .3 + .7 * Math.abs(Math.sin(t * 2.3 + i * 1.7)), k = out(span(t, .3 + i * .08, .8 + i * .08));
    x.fillStyle = hexA(WH, .12); x.fillRect(1500, 300 + i * 46, 300, 14); x.fillStyle = i === 2 ? OR : WH; x.fillRect(1500, 300 + i * 46, 300 * v * k, 14); }
  txt('SCAN', 1500, 280, { size: 20, w: 700, f: MONO, col: GR, sp: 4 });
  // flash no fim do compasso (entra o corte)
  const fl = span(t, 1.75, 2); if (fl) { x.fillStyle = hexA(WH, fl * fl); x.fillRect(0, 0, W, H); }
  hud(t + 0);
});

// 2) tipografia em movimento: uma palavra por batida, cada uma com outra cor
const PAL = [['ENCONTRE', BK, OR], ['CLIENTES', OR, BK], ['EM QUALQUER', BK, WH], ['CIDADE.', WH, OR]];
CENAS.push(function (t) {
  const b = Math.min(3, Math.floor(t / BEAT)), lt = t - b * BEAT, [p, fundo, tinta] = PAL[b];
  x.fillStyle = fundo; x.fillRect(0, 0, W, H);
  // palavra anterior saindo (resto da batida anterior) para dar continuidade
  const ent = out(lt / .28), sz = b === 2 ? 250 : 300;
  x.save(); x.beginPath(); x.rect(0, H / 2 - sz * .78, W, sz * 1.02); x.clip();
  font(sz, 900); x.letterSpacing = '-8px'; const wTot = x.measureText(p).width; let px = W / 2 - wTot / 2;
  // cada letra entra de baixo, em sequência, e troca de cor numa onda
  [...p].forEach((ch, i) => {
    const k = out((lt - i * .022) / .26), cw = x.measureText(ch).width;
    const onda = clamp(Math.sin((lt * 6 - i * .5)) * .5 + .5);
    x.fillStyle = (lt > .18 && onda > .82) ? (tinta === OR ? WH : OR) : tinta;
    if (fundo === OR && x.fillStyle.toUpperCase() === OR) x.fillStyle = BK;
    x.fillText(ch, px, H / 2 + sz * .2 + (1 - k) * sz); px += cw - 8;
  });
  x.restore(); x.letterSpacing = '0px';
  // sublinhado que acompanha a batida
  x.fillStyle = tinta; x.fillRect(W / 2 - 260, H / 2 + sz * .38, 520 * ent, 10);
  // legendas do visor
  txt(`0${b + 1} / 04`, 110, 140, { size: 24, w: 700, f: MONO, col: tinta, sp: 4 });
  txt('PROSPECÇÃO AUTOMÁTICA', W - 110, 140, { size: 24, w: 700, f: MONO, col: tinta, al: 'right', sp: 4 });
  hud(t + 2, fundo === WH ? BK : (fundo === OR ? BK : WH), .5);
});

// 3) grade de formas que se transformam
CENAS.push(function (t) {
  x.fillStyle = BK; x.fillRect(0, 0, W, H);
  const cs = 120, cols = 17, rows = 10, ox = (W - (cols - 1) * cs) / 2, oy = (H - (rows - 1) * cs) / 2;
  const onda = t * 2.2;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const cx = ox + i * cs, cy = oy + j * cs, d = Math.hypot(i - (cols - 1) / 2, j - (rows - 1) / 2);
    const k = Math.max(0, onda * 2 - d * .35) , ap = out(span(t, d * .05, d * .05 + .35));
    const s = 34 * ap * (1 + .25 * pulse(t) * Math.exp(-d * .2));
    const quente = Math.abs(((onda * 3 - d) % 6 + 6) % 6 - 3) < .55;
    desenhaForma(cx, cy, s, k, k * .6);
    if (quente) { x.fillStyle = OR; x.fill(); } else { x.strokeStyle = hexA(WH, .55); x.lineWidth = 2; x.stroke(); }
  }
  // título
  const k = outBack(span(t, .5, .85));
  x.save(); x.fillStyle = hexA(BK, .82); const bw = 980, bh = 300; x.fillRect(W / 2 - bw / 2, H / 2 - bh / 2, bw, bh * k); x.restore();
  if (k > .3) {
    txt('99', W / 2 - 400, H / 2 + 70, { size: 220, w: 900, col: OR, sp: -8 });
    txt('NICHOS', W / 2 - 110, H / 2 + 10, { size: 120, w: 900, col: WH, sp: -4 });
    const lista = 'LIMPEZA · METALÚRGICA · DENTISTA · BARBEARIA · ELETRICISTA · ACADEMIA · ';
    x.save(); x.beginPath(); x.rect(W / 2 - 110, H / 2 + 34, 600, 60); x.clip();
    txt(lista + lista, W / 2 - 110 - (t * 260) % 1400, H / 2 + 74, { size: 26, w: 700, f: MONO, col: GR, sp: 2 }); x.restore();
  }
  hud(t + 4);
});

// 4) esfera de partículas
CENAS.push(function (t) {
  const g = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, H * .8); g.addColorStop(0, '#1a0e0b'); g.addColorStop(1, BK); x.fillStyle = g; x.fillRect(0, 0, W, H);
  const junta = out(span(t, 0, .9)), R = 360 * (1 + .04 * pulse(t)), ry = t * .9 + .4, rx = .35;
  const cy_ = Math.cos(ry), sy_ = Math.sin(ry), cx_ = Math.cos(rx), sx_ = Math.sin(rx), cx0 = W * .62, cy0 = H / 2;
  const pts = [];
  for (const p of ESF) {
    let X = lerp(p.sx, p.x, junta), Y = lerp(p.sy, p.y, junta), Z = lerp(p.sz, p.z, junta);
    let x1 = X * cy_ + Z * sy_, z1 = -X * sy_ + Z * cy_; let y1 = Y * cx_ - z1 * sx_, z2 = Y * sx_ + z1 * cx_;
    const pz = 2.6 / (2.6 + z2); pts.push([cx0 + x1 * R * pz, cy0 + y1 * R * pz, z2, p.quente]);
  }
  pts.sort((a, b) => b[2] - a[2]);
  x.save(); x.globalCompositeOperation = 'lighter';
  for (const [px, py, z, q] of pts) {
    const prof = clamp((1 - z) / 2), s = .8 + prof * 2.6;   // partículas ainda espalhadas podem sair de [-1,1]
    if (q) { x.fillStyle = hexA(OR, .25 + prof * .6); x.beginPath(); x.arc(px, py, s * 3.2, 0, 7); x.fill(); x.fillStyle = hexA('#ffd2c6', .8 * prof); x.beginPath(); x.arc(px, py, s, 0, 7); x.fill(); }
    else { x.fillStyle = hexA(WH, .12 + prof * .55); x.fillRect(px - s / 2, py - s / 2, s, s); }
  }
  x.restore();
  // anel orbital
  x.save(); x.translate(cx0, cy0); x.rotate(-.25); x.scale(1, .28); x.strokeStyle = hexA(OR, .6); x.lineWidth = 3;
  x.beginPath(); x.arc(0, 0, R * 1.35, t * 2, t * 2 + Math.PI * 1.3); x.stroke(); x.restore();
  // texto à esquerda
  const k1 = out(span(t, .25, .6)), k2 = out(span(t, .5, .85)), k3 = out(span(t, .75, 1.1));
  txt('BRASIL', 140 - (1 - k1) * 80, 420, { size: 130, w: 900, col: WH, a: k1, sp: -4 });
  txt('EUA', 140 - (1 - k2) * 80, 560, { size: 130, w: 900, col: OR, a: k2, sp: -4 });
  txt('+ 8 PAÍSES', 140 - (1 - k3) * 80, 690, { size: 90, w: 900, col: WH, a: k3, sp: -2 });
  txt('BUSCA EM QUALQUER CIDADE DO MUNDO', 144, 760, { size: 22, w: 700, f: MONO, col: GR, a: k3, sp: 3 });
  hud(t + 6);
});

// 5) glóbulos 3D brilhantes com os dados de cada empresa
const GLOB = [['TELEFONE', OR, 120], ['WHATSAPP', WH, 95], ['SITE', OR, 80], ['INSTAGRAM', WH, 70], ['NOTA ★ 4.8', OR, 105], ['ENDEREÇO', WH, 75]];
function globulo(px, py, r, cor, brilho = 1) {
  x.save(); x.globalCompositeOperation = 'lighter';
  const halo = x.createRadialGradient(px, py, r * .4, px, py, r * 2.4); halo.addColorStop(0, hexA(cor, .35 * brilho)); halo.addColorStop(1, hexA(cor, 0));
  x.fillStyle = halo; x.beginPath(); x.arc(px, py, r * 2.4, 0, 7); x.fill(); x.restore();
  const g = x.createRadialGradient(px - r * .35, py - r * .4, r * .05, px, py, r);
  if (cor === OR) { g.addColorStop(0, '#ffd9cf'); g.addColorStop(.25, '#ff7a5c'); g.addColorStop(.75, OR); g.addColorStop(1, '#7a1a08'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(.3, '#e6e4e0'); g.addColorStop(.8, '#8a8a90'); g.addColorStop(1, '#2a2a2e'); }
  x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  // luz de borda
  x.strokeStyle = hexA('#ffffff', .35); x.lineWidth = 2; x.beginPath(); x.arc(px, py, r - 2, -2.4, -.6); x.stroke();
}
CENAS.push(function (t) {
  x.fillStyle = BK; x.fillRect(0, 0, W, H);
  halftone((px, py) => .5 * Math.exp(-Math.pow(Math.hypot(px - W / 2, py - H / 2) / 700, 2)) * (.6 + .4 * Math.sin(t * 2 + px * .004)), hexA(OR, .14), 26);
  const lista = GLOB.map((gb, i) => {
    const a = i / GLOB.length * Math.PI * 2 + t * .8, ap = outBack(span(t, i * .09, i * .09 + .5));
    const z = Math.sin(a), px = W / 2 + Math.cos(a) * 600, py = H / 2 + 130 + z * 120 + Math.sin(t * 2.5 + i) * 22;
    return { gb, px, py, z, r: gb[2] * ap * (1 + .35 * z) * (1 + .08 * pulse(t)), ap };
  }).sort((a, b) => a.z - b.z);
  lista.forEach(o => {
    if (o.r < 2) return;
    // linha até o rótulo
    globulo(o.px, o.py, o.r, o.gb[1], .8 + .4 * pulse(t));
    const lx = o.px + (o.px > W / 2 ? 1 : -1) * (o.r + 40), ly = o.py - o.r - 20;

    x.fillStyle = '#0f0f10'; rr(fx, PY + 192, 310, 62, 12); x.fill(); x.strokeStyle = '#2c2c30'; x.stroke();

    x.globalAlpha = clamp(ent * 1.4) * k; x.fillStyle = i === 0 && t > 1.4 ? hexA(OR, .12) : '#202023'; rr(PX + 30, ly + (1 - k) * 30, PW - 60, 72, 12); x.fill();
    txt(L[0], PX + 50, ly + 46 + (1 - k) * 30, { size: 26, w: 800, col: WH }); txt(L[1], PX + 560, ly + 46 + (1 - k) * 30, { size: 24, w: 500, f: MONO, col: WH });
    txt(L[2], PX + 870, ly + 46 + (1 - k) * 30, { size: 24, w: 700, col: '#e5b84e' });

    x.fillStyle = '#25D366'; rr(PX + 1170, ly + 16 + (1 - k) * 30, 170, 42, 10); x.fill(); txt('WhatsApp', PX + 1255, ly + 45 + (1 - k) * 30, { size: 20, w: 800, col: '#06210f', al: 'center' });
    x.globalAlpha = clamp(ent * 1.4); });
  // contador
  const n = Math.round(60 * out(span(t, .62, 1.3))); if (t > .62) { txt(String(n), PX + PW - 60, PY + 120, { size: 56, w: 900, col: OR, al: 'right' }); txt('ENCONTRADOS', PX + PW - 60, PY + 150, { size: 16, w: 700, f: MONO, col: GR, al: 'right', sp: 2 }); }

// 8) revelação do logo
CENAS.push(function (t) {
  x.fillStyle = BK; x.fillRect(0, 0, W, H);

/* ---------- transições nos cortes ---------- */
function transicao(t) {
  const corte = Math.round(t / BAR) * BAR, d = t - corte; if (corte <= 0 || corte >= DUR) return;
  const tipo = (corte / BAR) % 2;   // alterna: faixas e halftone
  if (d < 0 && d > -.25) {          // cobre a tela nos últimos 1/2 de batida
    const k = ease((d + .25) / .25);
    if (tipo) faixas(k, [OR, BK, WH], true); else halftone(() => k * 1.45, OR, 40, .5);
  } else if (d >= 0 && d < .3) {    // descobre a nova cena
    const k = ease(d / .3);
    if (tipo) faixas(k, [OR, BK, WH], false); else halftone(() => (1 - k) * 1.45, OR, 40, .5);
  }
}

function render(t) {
  t = clamp(t, 0, DUR - 1e-4);
  const i = Math.min(CENAS.length - 1, Math.floor(t / BAR)), lt = t - i * BAR;
  x.save(); CENAS[i](lt, lt / BAR); x.restore();
  // tremida de câmera no tempo forte de cada compasso
  transicao(t);
  scan(.045); grao(t, .05); vinheta(.5);
  // flash curto em cada corte
  const d = t - Math.round(t / BAR) * BAR; if (Math.abs(d) < .035 && t > .1 && t < DUR - .1) { x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(0, 0, W, H); }
}
window.render = render;

// prévia no navegador: toca em tempo real (o render.mjs chama render(t) direto)
if (!location.search.includes('render')) {
  let t0 = null; const loop = now => { t0 = t0 ?? now; render(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  const go = () => requestAnimationFrame(loop); (logoImg.complete ? go() : logoImg.onload = go);
}
